# harness v2 (SC-5859) — generated by `harness init`; change the template in ~/Development/harness, never this file
# Small loop: pre-commit (parallel, staged files) + pre-push (check:fast).
# Big loop:   pre-merge-commit → `harness premerge` (tier A: the whole suite; B/C: + CI as the required check).
min_version: 1.5.0
# Command output and failures only, no banners (the ref guard fires on every ref update).
output:
  - execution_out
  - failure

pre-commit:
  parallel: true
  commands:
    lint:
      glob: "*.{ts,tsx,js,jsx,mjs,cjs}"
      run: "npx eslint --max-warnings=0 --no-warn-ignored {staged_files}"
    format:
      glob: "*.{ts,tsx,js,jsx,mjs,cjs,json,css,scss,md,yml,yaml}"
      run: "npx prettier --check --ignore-unknown {staged_files}"
    types:
      glob: "*.{ts,tsx,mts,cts}"
      run: "npx tsc --noEmit --incremental --tsBuildInfoFile node_modules/.cache/harness/tsbuildinfo"
    tests:
      glob: "*.{ts,tsx,js,jsx,mjs,cjs}"
      run: "npx vitest related --run --passWithNoTests {staged_files}"
    secrets:
      run: "gitleaks git --staged --redact --no-banner ."
    default-branch:
      run: "command -v harness >/dev/null 2>&1 || { echo \"harness CLI missing: ln -s ~/Development/harness/bin/harness.mjs ~/.local/bin/harness\"; exit 1; }; harness gate direct-commit"

pre-push:
  commands:
    check-fast:
      run: "npm run -s check:fast"
    push-guard:
      # lefthook skips pre-push commands when the pushed commits already exist on the remote
      # ("no matching push files") — which is exactly the tier-B fast-forward of a CI-checked
      # branch SHA. A fixed file list keeps this guard from ever being skipped.
      files: "git ls-files harness.json"
      use_stdin: true
      run: "command -v harness >/dev/null 2>&1 || { echo \"harness CLI missing: ln -s ~/Development/harness/bin/harness.mjs ~/.local/bin/harness\"; exit 1; }; harness gate push-guard"

pre-merge-commit:
  commands:
    premerge:
      run: "command -v harness >/dev/null 2>&1 || { echo \"harness CLI missing: ln -s ~/Development/harness/bin/harness.mjs ~/.local/bin/harness\"; exit 1; }; harness premerge --hook"

# Guards the default branch against every way of moving it that skips pre-merge-commit
# (fast-forward, reset, rebase, update-ref, branch -f): it may only point at a tree that
# passed `harness premerge`, or at a commit a remote already has (CI-gated on tier B/C).
reference-transaction:
  commands:
    ref-guard:
      use_stdin: true
      run: "command -v harness >/dev/null 2>&1 || { echo \"harness CLI missing: ln -s ~/Development/harness/bin/harness.mjs ~/.local/bin/harness\"; exit 1; }; harness gate ref-guard {1}"
