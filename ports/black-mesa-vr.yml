known_bugs:
  - Manual reloading is not currently implemented
  - Two-handed weapons are planned for a later update
  - Shots may misalign with the weapon; press the right thumbstick to recenter
  - Virtual Desktop must use OpenXR Runtime = VDXR, as SteamVR inverts the world
notes: L4D2VR-style DXVK-based mod with true stereo rendering and OpenXR; a separate macOS version exists.
