known_bugs:
  - Melee hits are not reliable, especially against planks and breakable objects
  - Phone flashlight glow can flicker or change colour
  - Notes and some UI elements can be small and hard to read
  - Arm and sleeve cutting on the left hand is imperfect; a nightstick in the left hand shows the whole arm
  - Dual wielding may be janky
  - Walking can feel slow for a few seconds after saving at a tape recorder
notes: Unofficial SteamVR port built on the Xash3D FWGS engine; early release with the full campaign playable.
