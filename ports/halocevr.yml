required_files: "Original PC CD installation of Halo: Combat Evolved (not Custom Edition or MCC), patched to 1.0.10"
known_bugs:
  - Game sometimes isn't the focused window on launch, and inputs/sounds may break when unfocused
  - First stage of the tutorial doesn't detect headset movement
  - Camera briefly behaves weirdly when entering/exiting vehicles
  - Reloading a checkpoint made while in a vehicle can mess with the camera position
  - Melee and interact use head aiming rather than controller aiming
  - Crosshair only lights up red when looking at an enemy, not when pointing a gun at one
  - On screen button prompts display keyboard bindings rather than VR bindings
  - Mod config/log file won't generate if installed to Program Files unless run as administrator
  - Occasional stutters can cause jarring motion smoothing in vehicles
  - Some users report minor distortion/warping when tilting head side to side
notes: "Not compatible with Halo: The Master Chief Collection; requires original PC version only."
